<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"><defs><linearGradient id="bg" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#030712"/></linearGradient><linearGradient id="cyan-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4" stop-opacity=".8"/><stop offset="100%" stop-color="#3b82f6" stop-opacity=".2"/></linearGradient><linearGradient id="purple-glow" x1="0%" x2="100%" y1="100%" y2="0%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".6"/><stop offset="100%" stop-color="#ec4899" stop-opacity=".1"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#1e293b" stroke-opacity=".5" stroke-width="1" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity=".3"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{transform:scale(1);opacity:.6}50%{transform:scale(1.15);opacity:1}}.title-text{font-weight:900;font-size:60px;fill:#fff;letter-spacing:4px}.badge-text,.subtitle-text,.tagline-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:600;font-size:18px;fill:#38bdf8;letter-spacing:2px}.tagline-text{font-weight:400;font-size:15px;fill:#94a3b8}.badge-text{font-size:12px;font-weight:700;fill:#38bdf8;letter-spacing:1.5px}.footer-text{font-family:&quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,Menlo,monospace;font-size:13px;fill:#64748b}.pulse-node,.radar-sweep{animation:pulse 3s infinite ease-in-out;transform-origin:950px 200px}.radar-sweep{animation:rotateSweep 12s linear infinite}.flow-line{stroke-dasharray:8,8;animation:dash 20s linear i